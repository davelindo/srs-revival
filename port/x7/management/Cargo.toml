[package]
name = "x7-management"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
dm870 = { path = "../../module/dm870", features = ["linux"] }
form_urlencoded = "1.2"
getrandom = "0.4"
httparse = "1.10"
libc = "0.2"
maud = "=0.27.0"
pbkdf2 = "0.13"
rand = "0.10"
russh = { version = "=0.65.2", default-features = false, features = ["ring"] }
tokio = { version = "=1.54.1", features = ["rt", "net", "io-util", "macros", "process", "sync", "time"] }
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"
x7-control = { path = "../control" }
zd1-net = { path = "../../module/os/apps/zd1-net" }
zd1-persparam = { path = "../../module/os/apps/zd1-persparam" }
zd1-settings = { path = "../../module/os/apps/zd1-settings" }
zd1-svc = { path = "../../module/os/apps/zd1-svc" }
zd1-sys = { path = "../../module/os/apps/zd1-sys" }

[target.'cfg(all(target_os = "linux", target_arch = "arm"))'.dependencies]
zd1-compat = { path = "../../module/os/apps/zd1-compat" }
